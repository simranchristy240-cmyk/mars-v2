# Render Blueprint for MARS v2
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/blueprint-spec
#
# Unlike Bodhi (separate API + static site + Postgres), MARS is a monorepo
# that serves the Vite SPA from Express (client already calls relative /api).
# Database is MongoDB Atlas (set MONGODB_URI yourself — not a Render Postgres DB).

services:
  - type: web
    name: mars-v2
    runtime: node
    plan: free
    region: singapore
    # Install includes devDependencies so TypeScript/Vite can build on Render
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"

      # --- Required: paste from MongoDB Atlas (Network Access must allow 0.0.0.0/0) ---
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      # Same-origin SPA: set to your Render URL after first deploy, e.g. https://mars-v2.onrender.com
      - key: CLIENT_ORIGIN
        sync: false

      # --- Optional integrations (app still boots with mocks/empty) ---
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Vite vars are baked in at build time — set these before the first deploy
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
